[versions]
# Base libraries
kotlin = "1.9.0"
kotlin-coroutines = "1.6.4"
kotlin-atomicfu = "0.20.2"

# Gradle plugins
sponge = "0.2.1-SNAPSHOT"
loom = "1.2.+"
forgegradle = "6.+"
spotless = "6.19.0"

# Core mod dependencies
cc-tweaked = "1.113.0"
mixin = "0.8.5"
broccolium = "1.1.19"
tweakium = "1.1.19"
broccolium-jjar = "[1.1.19, 1.2.0)"
tweakium-jjar = "[1.1.19, 1.2.0)"
sqlite = "[3.43.0.0, 3.44.0.0)"
javalin = "[5.6.2, 5.7.0)"
pebble = "[2.4.0, 2.5.0)"
common-math = "[3.6.1, 3.7.0)"
statsd-client = "[3.0.1, 3.1.0)"

# Fabric dependencies
fabric-api = "0.92.0+1.20.1"
fabric-loader = "0.15.11"
fabric-kotlin = "1.11.0+kotlin.2.0.0"
forgeconfigapirt = "8.0.0"
modmenu = "7.2.1"

# Forge dependencies
forge = "47.2.0"
forge-kotlin = "4.3.0"
parchment = "2023.07.16"
parchmentMc = "1.20.1"
# Extra mod dependencies

# Dev mod dependenceis
jei = "15.1.0.19"
rei = "12.0.625"

# Testing
autoService = "1.0.1"
byteBuddy = "1.14.2"
hamcrest = "2.2"
jqwik = "1.7.2"
junit = "5.9.2"


[libraries]
# Base libraries
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-atomicfu = {module = "org.jetbrains.kotlinx:atomicfu-jvm", version.ref = "kotlin-atomicfu"}

# Plugins
kotlin-plugin = {module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
spotless-plugin = {module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref="spotless"}

# Core mod dependencies
cc-tweaked-common = {module = "cc.tweaked:cc-tweaked-1.20.1-common-api", version.ref = "cc-tweaked"}
cc-tweaked-core = {module = "cc.tweaked:cc-tweaked-1.20.1-core", version.ref = "cc-tweaked"}
common-config = {module = "fuzs.forgeconfigapiport:forgeconfigapiport-common", version.ref = "forgeconfigapirt"}
mixin = { module = "org.spongepowered:mixin", version.ref = "mixin" }
broccolium-core = {module = "site.siredvin:broccolium-common-1.20.1", version.ref = "broccolium"}
tweakium-core = {module = "site.siredvin:tweakium-common-1.20.1", version.ref = "tweakium"}
sqlite = {module="org.xerial:sqlite-jdbc", version.ref="sqlite"}
javalin = {module = "io.javalin:javalin", version.ref="javalin"}
javalin-rendering = {module = "io.javalin:javalin-rendering", version.ref="javalin"}
pebble = {module ="com.mitchellbosecke:pebble", version.ref="pebble"}
common-math = {module = "org.apache.commons:commons-math3", version.ref="common-math"}
statsd-client = {module = "com.timgroup:java-statsd-client", version.ref="statsd-client"}


# Fabric mod dependencies
fabric-loader = {module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader"}
fabric-api = {module = "net.fabricmc.fabric-api:fabric-api", version.ref="fabric-api"}
fabric-kotlin = {module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-kotlin"}
fabric-config = {module = "fuzs.forgeconfigapiport:forgeconfigapiport-fabric", version.ref = "forgeconfigapirt"}
cc-tweaked-fabric-api = {module = "cc.tweaked:cc-tweaked-1.20.1-fabric-api", version.ref = "cc-tweaked"}
cc-tweaked-fabric = {module = "cc.tweaked:cc-tweaked-1.20.1-fabric", version.ref = "cc-tweaked"}
broccolium-fabric = {module = "site.siredvin:broccolium-fabric-1.20.1", version.ref = "broccolium"}
tweakium-fabric = {module = "site.siredvin:tweakium-fabric-1.20.1", version.ref = "tweakium"}
modmenu = {module = "com.terraformersmc:modmenu", version.ref="modmenu"}

# Forge mod dependencies
cc-tweaked-forge =  {module = "cc.tweaked:cc-tweaked-1.20.1-forge", version.ref="cc-tweaked"}
forge-kotlin = {module = "thedarkcolour:kotlinforforge", version.ref = "forge-kotlin"}
broccolium-forge = {module = "site.siredvin:broccolium-forge-1.20.1", version.ref = "broccolium"}
tweakium-forge = {module = "site.siredvin:tweakium-forge-1.20.1", version.ref = "tweakium"}
broccolium-jjar-forge = {module = "site.siredvin:broccolium-forge-1.20.1", version.ref = "broccolium-jjar"}
tweakium-jjar-forge = {module = "site.siredvin:tweakium-forge-1.20.1", version.ref = "tweakium-jjar"}

# Dev mod dependencies
jei-forge = { module = "mezz.jei:jei-1.20.1-forge", version.ref = "jei" }
rei-fabric = {module = "me.shedaniel:RoughlyEnoughItems-fabric", version.ref = "rei"}
[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
vanillaGradle = { id = "org.spongepowered.gradle.vanilla", version.ref = "sponge"}
loom = {id = "fabric-loom", version.ref = "loom"}
spotless = {id = "com.diffplug.spotless", version.ref="spotless"}

[bundles]
kotlin = ["kotlin-stdlib", "kotlin-coroutines", "kotlin-atomicfu"]
cccommon = ["cc-tweaked-common", "cc-tweaked-core", "broccolium-core", "tweakium-core"]
apicommon = ["common-config"]
db = ["sqlite"]
webframework = [
    "javalin", "javalin-rendering", "pebble"
]
math = [
    "common-math"
]
metrics = [
    "statsd-client"
]
fabric-cc = ["cc-tweaked-fabric", "cc-tweaked-core", "cc-tweaked-fabric-api"]
fabric-include = ["broccolium-fabric", "tweakium-fabric"]
fabric-core = ["fabric-api", "fabric-kotlin", "fabric-config", "fabric-loader"]
forge-raw = ["forge-kotlin"]
forge-cc = ["cc-tweaked-forge"]
forge-include = ["broccolium-forge", "tweakium-forge"]
forge-jjar = ["broccolium-jjar-forge", "tweakium-jjar-forge"]

# Minecraft
#externalMods-common = ["jei-api", "nightConfig-core", "nightConfig-toml"]
#externalMods-forge-compile = ["oculus", "jei-api"]
externalMods-forge-runtime = ["jei-forge"]
#externalMods-fabric = ["nightConfig-core", "nightConfig-toml"]
#externalMods-fabric-compile = ["iris", "jei-api", "rei-api", "rei-builtin"]
externalMods-fabric-runtime = ["rei-fabric", "modmenu"]
#
