name: CI

on:
  pull_request:
  push:
    branches:
      - "1.21"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Loom 1.18 requires Gradle to run on Java 25; Minecraft still compiles with the Java 21 toolchain.
      - name: Set up Java 25 launcher
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          mkdir -p ci-reports
          set -o pipefail
          timeout --foreground 1200s ./gradlew clean build --no-daemon 2>&1 | tee ci-reports/build.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          if-no-files-found: ignore
          path: |
            ci-reports/**
            **/build/test-results/**
            **/build/reports/**
