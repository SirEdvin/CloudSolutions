name: CI

on:
  pull_request:
  push:
    branches:
      - "1.20"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          mkdir -p ci-reports
          set -o pipefail
          timeout --foreground 1200s ./gradlew clean build --no-daemon 2>&1 | tee ci-reports/build.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          if-no-files-found: ignore
          path: |
            ci-reports/**
            **/build/test-results/**
            **/build/reports/**
